name: RAG quality checks
on:
  push:
    paths:
      - "app/**"
      - "tests/**"
      - "scripts/**"
      - "eval/**"
      - "pyproject.toml"
      - ".github/workflows/rag-quality.yml"
  pull_request:
    paths:
      - "app/**"
      - "tests/**"
      - "scripts/**"
      - "eval/**"
      - "pyproject.toml"
      - ".github/workflows/rag-quality.yml"
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest
      - run: ruff check .
